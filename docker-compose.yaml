services:
  db:
    image: postgres:16-alpine
    container_name: esvelto-db-container
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - classroom_volume:/var/lib/postgresql/data

volumes:
  classroom_volume: